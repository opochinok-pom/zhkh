services:
  - type: web
    name: tenant-portal-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: SMSC_LOGIN
        sync: false
      - key: SMSC_PASSWORD
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: tenant-portal-frontend
          type: web
          property: host
          format: https://{value}
      - key: PORT
        value: "10000"

  - type: web
    name: tenant-portal-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_URL
        fromService:
          name: tenant-portal-api
          type: web
          property: host
          format: https://{value}
